<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Uzayda Hayatta Kal</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050505; touch-action: none; font-family: sans-serif; }
        #ui {
            position: absolute; top: 20px; width: 100%; text-align: center;
            color: #fff; pointer-events: none; text-shadow: 0 0 10px #ff0000;
        }
        #joystick {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            width: 100px; height: 100px; background: rgba(255,255,255,0.1); border-radius: 50%;
            border: 2px solid #555;
        }
        #knob {
            width: 40px; height: 40px; background: #ff3300; border-radius: 50%;
            position: absolute; top: 30px; left: 30px; box-shadow: 0 0 20px #ff3300;
        }
    </style>
</head>
<body>

    <div id="ui">
        <h2 id="msg">METEORLARDAN KAÇ!</h2>
        <div id="score">PUAN: 0</div>
    </div>
    <div id="joystick"><div id="knob"></div></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- SAHNE KURULUMU ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // --- UÇAK TASARIMI (Gövde + Kanatlar) ---
        const shipGroup = new THREE.Group();
        
        // Gövde
        const bodyGeo = new THREE.ConeGeometry(0.3, 1.2, 8);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0xaaaaaa });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.rotation.x = Math.PI / 2;
        shipGroup.add(body);

        // Kanatlar
        const wingGeo = new THREE.BoxGeometry(1.5, 0.05, 0.4);
        const wingMat = new THREE.MeshStandardMaterial({ color: 0xff0000 });
        const wings = new THREE.Mesh(wingGeo, wingMat);
        shipGroup.add(wings);

        scene.add(shipGroup);

        // --- IŞIKLAR ---
        const sun = new THREE.DirectionalLight(0xffffff, 1.5);
        sun.position.set(5, 10, 5);
        scene.add(sun);
        scene.add(new THREE.AmbientLight(0x333333));

        // --- METEOR SİSTEMİ ---
        const meteors = [];
        const meteorGeo = new THREE.DodecahedronGeometry(0.5, 0);
        const meteorMat = new THREE.MeshStandardMaterial({ color: 0x664422 });

        function createMeteor() {
            const m = new THREE.Mesh(meteorGeo, meteorMat);
            m.position.set((Math.random() - 0.5) * 10, 0, -20);
            m.rotation.set(Math.random(), Math.random(), Math.random());
            scene.add(m);
            meteors.push(m);
        }

        // --- KONTROLLER ---
        let moveX = 0;
        const knob = document.getElementById('knob');
        window.addEventListener('touchmove', (e) => {
            const touch = e.touches[0];
            const rect = document.getElementById('joystick').getBoundingClientRect();
            let dx = touch.clientX - (rect.left + 50);
            dx = Math.max(-40, Math.min(40, dx));
            knob.style.left = (30 + dx) + "px";
            moveX = dx / 40;
        });
        window.addEventListener('touchend', () => {
            knob.style.left = "30px";
            moveX = 0;
        });

        // --- OYUN DÖNGÜSÜ ---
        let score = 0;
        let gameOver = false;

        function animate() {
            if (gameOver) return;
            requestAnimationFrame(animate);

            // Gemi hareketi (Sınırlandırılmış)
            shipGroup.position.x += moveX * 0.15;
            shipGroup.position.x = Math.max(-4.5, Math.min(4.5, shipGroup.position.x));
            shipGroup.rotation.z = -moveX * 0.5; // Dönüş efekti

            // Meteorları hareket ettir
            if (Math.random() < 0.05) createMeteor();
            
            for (let i = meteors.length - 1; i >= 0; i--) {
                meteors[i].position.z += 0.2;
                meteors[i].rotation.x += 0.02;

                // Çarpışma Testi
                const dist = shipGroup.position.distanceTo(meteors[i].position);
                if (dist < 0.7) {
                    document.getElementById('msg').innerText = "EYVAH! ÇARPTIN!";
                    gameOver = true;
                    setTimeout(() => location.reload(), 2000);
                }

                // Ekrandan çıkanları sil
                if (meteors[i].position.z > 5) {
                    scene.remove(meteors[i]);
                    meteors.splice(i, 1);
                    score++;
                    document.getElementById('score').innerText = `PUAN: ${score}`;
                }
            }

            camera.position.x = shipGroup.position.x * 0.5;
            camera.lookAt(shipGroup.position);
            renderer.render(scene, camera);
        }

        camera.position.set(0, 3, 6);
        animate();
    </script>
</body>
</html>
